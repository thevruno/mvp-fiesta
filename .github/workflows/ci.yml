name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next genera next-env.d.ts y los tipos de rutas; sin esto tsc no los encuentra.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
